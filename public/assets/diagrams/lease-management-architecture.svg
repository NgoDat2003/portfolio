<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Store Lease Management architecture</title>
  <desc id="d">Admin, accounting and site users work in a Next.js 15 web app with the addendum workspace, termination drawer, OCR scan intake and cash-flow console. It talks to a NestJS 10 API with the addendum engine and dry-run, payment anchor lock, schedules and proration, SAP journal entry export without duplicates, master data import with diff preview, audit log and expiry alerts. Data lives in PostgreSQL 16 with Prisma 7 and PDFs in MinIO; an external OCR service reads scans, and journal entry files are imported into SAP Business One manually. Highlighted boxes are my work; dashed boxes are platform or external systems.</desc>
  <style>
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; fill: #2A231F; }
    .h { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #736860; }
    .tile { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .mine { fill: #F8EBB5; stroke: #D9654B; stroke-width: 2.5; }
    .team { fill: none; stroke: #736860; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .panel { fill: #FFFCF7; stroke: #2A231F; stroke-width: 2; }
    .chip { fill: #D8E6EF; stroke: #2A231F; stroke-width: 1.5; }
    .shadow { fill: #2A231F; }
    .arrow { stroke: #2A231F; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A231F"/>
    </marker>
  </defs>

