      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">11 Dedicated Smoke Test Scripts</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Visual Parity (4 Screen Sizes)</text>
