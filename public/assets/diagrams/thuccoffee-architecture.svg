<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Thức Coffee architecture</title>
  <desc id="d">Migration and runtime of the Thức Coffee brand website and admin CMS. Migration scripts crawl 400 paths of the old ASP.NET MVC site on IIS, upsert 267 posts, 42 products and 7 stores by slug, seed 498 images into MinIO and sanitize post HTML, tested on 267 posts. At runtime an admin CMS with Tiptap 3 and JWT, an Express 5 + Drizzle API and a React 19 public site run behind Nginx (/api, /media) with Docker Compose, on PostgreSQL 16 and MinIO, with a Google Maps embed. Highlighted boxes are my work; dashed boxes are existing or external systems.</desc>
  <style>
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; fill: #2A231F; }
    .h { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #736860; }
    .tile { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .mine { fill: #F8EBB5; stroke: #D9654B; stroke-width: 2.5; }
    .team { fill: none; stroke: #736860; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .panel { fill: #FFFCF7; stroke: #2A231F; stroke-width: 2; }
    .chip { fill: #D8E6EF; stroke: #2A231F; stroke-width: 1.5; }
    .shadow { fill: #2A231F; }
    .arrow { stroke: #2A231F; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A231F"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#FAF4EA"/>

  <text x="40" y="58" style="font-size:28px;font-weight:800">Thức Coffee</text>
  <text x="40" y="82" class="sub" style="font-size:14px">Brand website &amp; admin CMS · migration and runtime</text>

  <!-- Legend -->
  <rect x="612" y="40" width="16" height="16" rx="3" class="mine"/>
  <text x="636" y="53" class="small">my work</text>
  <rect x="718" y="40" width="16" height="16" rx="3" class="team"/>
  <text x="742" y="53" class="small">existing / external</text>

  <!-- Old site -->
  <rect x="40" y="124" width="116" height="110" rx="14" class="team"/>
  <text x="98" y="164" text-anchor="middle" class="h">Old site</text>
  <text x="98" y="188" text-anchor="middle" class="small">ASP.NET MVC</text>
  <text x="98" y="206" text-anchor="middle" class="small">on IIS</text>
  <path d="M158 179 H184" class="arrow"/>

  <!-- Migration -->
  <rect x="194" y="110" width="256" height="308" rx="14" class="shadow"/>
  <rect x="188" y="104" width="256" height="308" rx="14" class="panel"/>
  <text x="206" y="134" class="h">Migration</text>

  <rect x="202" y="152" width="228" height="54" rx="10" class="mine"/>
  <text x="316" y="174" text-anchor="middle" class="tile">Crawler</text>
  <text x="316" y="193" text-anchor="middle" class="small">400 paths</text>
  <rect x="202" y="216" width="228" height="54" rx="10" class="mine"/>
  <text x="316" y="238" text-anchor="middle" class="tile">Seed upsert by slug</text>
  <text x="316" y="257" text-anchor="middle" class="small">267 posts, 42 products, 7 stores</text>
  <rect x="202" y="280" width="228" height="54" rx="10" class="mine"/>
  <text x="316" y="302" text-anchor="middle" class="tile">Image seed → MinIO</text>
  <text x="316" y="321" text-anchor="middle" class="small">498 images</text>
  <rect x="202" y="344" width="228" height="54" rx="10" class="mine"/>
  <text x="316" y="366" text-anchor="middle" class="tile">HTML sanitizer</text>
  <text x="316" y="385" text-anchor="middle" class="small">267 posts tested</text>

  <!-- Data stores -->
  <path d="M452 243 H484" class="arrow"/>
  <path d="M452 307 H484" class="arrow"/>
  <rect x="488" y="216" width="132" height="54" rx="10" class="team"/>
  <text x="554" y="247" text-anchor="middle" class="small">PostgreSQL 16</text>
  <rect x="488" y="280" width="132" height="54" rx="10" class="team"/>
  <text x="554" y="311" text-anchor="middle" class="small">MinIO</text>
  <path d="M656 243 H624" class="arrow"/>
  <path d="M656 307 H624" class="arrow"/>

  <!-- Runtime -->
  <rect x="666" y="110" width="260" height="308" rx="14" class="shadow"/>
  <rect x="660" y="104" width="260" height="308" rx="14" class="panel"/>
  <text x="678" y="134" class="h">Runtime</text>

  <rect x="674" y="152" width="232" height="54" rx="10" class="mine"/>
  <text x="790" y="174" text-anchor="middle" class="tile">Admin CMS</text>
  <text x="790" y="193" text-anchor="middle" class="small">Tiptap 3 · JWT</text>
  <rect x="674" y="216" width="232" height="54" rx="10" class="mine"/>
  <text x="790" y="238" text-anchor="middle" class="tile">API</text>
  <text x="790" y="257" text-anchor="middle" class="small">Express 5 + Drizzle</text>
  <rect x="674" y="280" width="232" height="54" rx="10" class="mine"/>
  <text x="790" y="302" text-anchor="middle" class="tile">Nginx /api · /media</text>
  <text x="790" y="321" text-anchor="middle" class="small">Docker Compose</text>
  <rect x="674" y="344" width="232" height="54" rx="10" class="mine"/>
  <text x="790" y="366" text-anchor="middle" class="tile">Public site</text>
  <text x="790" y="385" text-anchor="middle" class="small">React 19</text>

  <!-- External -->
  <path d="M790 420 V446" class="arrow"/>
  <rect x="674" y="452" width="232" height="44" rx="10" class="team"/>
  <text x="790" y="479" text-anchor="middle" class="small">Google Maps embed</text>
</svg>
