<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">QA/QC Audit App architecture</title>
  <desc id="d">QAM, QC, SM, AM and Admin users work in a Next.js 16 + antd 6 web app and a NestJS 11 API, backed by MongoDB with Mongoose 8 and MinIO for audit evidence. The team built the audit checklist and scoring UI, the Action Plan flow, the scoring core with CCP, the score backfill service, Action Plan reminders and dashboard metrics. My contributions are the multi-brand dashboard filter, Action Plan notes, the QC fee column, the missing-scores route with bulk apply, QC billing with qcRate and a backfill script, and the 3P payroll export with the BSC payroll sheet. Highlighted boxes are my work; dashed boxes are team or platform work.</desc>
