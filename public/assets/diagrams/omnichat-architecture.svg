<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">OmniChat architecture</title>
  <desc id="d">Customer messages from website, Zalo, Facebook, Instagram, Shopee, Lazada and TikTok Shop reach the ERPNext backend through platform webhooks, then appear in the React agent inbox over REST and Frappe realtime. Highlighted boxes are the parts built by the portfolio owner; dashed boxes are platform or team work.</desc>
  <style>
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; fill: #2A231F; }
    .h { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #736860; }
    .tile { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .mine { fill: #F8EBB5; stroke: #D9654B; stroke-width: 2.5; }
    .team { fill: none; stroke: #736860; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .panel { fill: #FFFCF7; stroke: #2A231F; stroke-width: 2; }
    .chip { fill: #D8E6EF; stroke: #2A231F; stroke-width: 1.5; }
    .shadow { fill: #2A231F; }
    .arrow { stroke: #2A231F; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A231F"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#FAF4EA"/>

  <text x="40" y="58" style="font-size:28px;font-weight:800">OmniChat</text>
  <text x="40" y="82" class="sub" style="font-size:14px">Omnichannel inbox inside ERPNext · architecture</text>

  <!-- Legend -->
  <rect x="612" y="40" width="16" height="16" rx="3" class="mine"/>
  <text x="636" y="53" class="small">my work</text>
  <rect x="718" y="40" width="16" height="16" rx="3" class="team"/>
  <text x="742" y="53" class="small">platform / team</text>

  <!-- Channels -->
  <rect x="40" y="110" width="190" height="380" rx="14" class="team"/>
  <text x="60" y="142" class="h">Channels</text>
  <text x="60" y="162" class="sub">customer messages</text>
  <rect x="56" y="178" width="156" height="34" rx="17" class="chip"/>
  <text x="134" y="200" text-anchor="middle" class="small">Website widget</text>
  <rect x="56" y="222" width="156" height="34" rx="17" class="chip"/>
  <text x="134" y="244" text-anchor="middle" class="small">Zalo OA</text>
  <rect x="56" y="266" width="156" height="34" rx="17" class="chip"/>
  <text x="134" y="288" text-anchor="middle" class="small">Facebook · Instagram</text>
  <rect x="56" y="310" width="156" height="34" rx="17" class="chip"/>
  <text x="134" y="332" text-anchor="middle" class="small">Shopee</text>
  <rect x="56" y="354" width="156" height="34" rx="17" class="chip"/>
  <text x="134" y="376" text-anchor="middle" class="small">Lazada</text>
  <rect x="56" y="398" width="156" height="34" rx="17" class="chip"/>
  <text x="134" y="420" text-anchor="middle" class="small">TikTok Shop</text>
  <text x="134" y="466" text-anchor="middle" class="sub">webhooks · OAuth</text>

  <text x="255" y="288" text-anchor="middle" class="sub" style="font-size:11px">webhook</text>
  <path d="M232 300 H276" class="arrow"/>

  <!-- Backend -->
  <rect x="286" y="116" width="286" height="380" rx="14" class="shadow"/>
  <rect x="280" y="110" width="286" height="380" rx="14" class="panel"/>
  <text x="300" y="142" class="h">ERPNext backend</text>
  <text x="300" y="162" class="sub">Frappe custom app in Python</text>

  <rect x="298" y="178" width="250" height="44" rx="10" class="team"/>
  <text x="423" y="205" text-anchor="middle" class="small">Conversation · Message · Contact DocTypes</text>
  <rect x="298" y="230" width="250" height="40" rx="10" class="team"/>
  <text x="423" y="255" text-anchor="middle" class="small">Send-message background jobs</text>
  <rect x="298" y="278" width="250" height="40" rx="10" class="team"/>
  <text x="423" y="303" text-anchor="middle" class="small">Auto-reply engine</text>

  <rect x="298" y="334" width="250" height="40" rx="10" class="team"/>
  <text x="423" y="359" text-anchor="middle" class="small">Unified conversation query API</text>
  <rect x="298" y="384" width="250" height="40" rx="10" class="mine"/>
  <text x="423" y="409" text-anchor="middle" class="tile">Order history API</text>
  <rect x="298" y="434" width="250" height="40" rx="10" class="mine"/>
  <text x="423" y="459" text-anchor="middle" class="tile">Per-channel auto-reply switch</text>

  <!-- Links -->
  <text x="600" y="228" text-anchor="middle" class="sub" style="font-size:11px">REST</text>
  <path d="M574 240 H624" class="arrow" style="marker-start:url(#head)"/>
  <text x="600" y="348" text-anchor="middle" class="sub" style="font-size:11px">realtime</text>
  <path d="M574 360 H624" class="arrow" style="marker-start:url(#head)"/>

  <!-- Agent inbox -->
  <rect x="634" y="116" width="292" height="380" rx="14" class="shadow"/>
  <rect x="628" y="110" width="292" height="380" rx="14" class="panel"/>
  <text x="648" y="142" class="h">Agent inbox · React</text>
  <text x="648" y="162" class="sub">page inside ERPNext Desk</text>

  <rect x="646" y="178" width="256" height="56" rx="10" class="mine"/>
  <text x="774" y="201" text-anchor="middle" class="tile">Conversation list</text>
  <text x="774" y="221" text-anchor="middle" class="small">inactive filter · 14 / 30 / 60 days</text>
  <rect x="646" y="244" width="256" height="56" rx="10" class="mine"/>
  <text x="774" y="267" text-anchor="middle" class="tile">Chat window</text>
  <text x="774" y="287" text-anchor="middle" class="small">files · emoji · image messages</text>
  <rect x="646" y="310" width="256" height="40" rx="10" class="mine"/>
  <text x="774" y="335" text-anchor="middle" class="tile">Expired chat → input locked</text>
  <rect x="646" y="360" width="256" height="56" rx="10" class="mine"/>
  <text x="774" y="383" text-anchor="middle" class="tile">Order history panel</text>
  <text x="774" y="403" text-anchor="middle" class="small">+ order detail modal</text>
  <rect x="646" y="428" width="256" height="44" rx="10" class="team"/>
  <text x="774" y="455" text-anchor="middle" class="small">Zustand · TanStack Query · socket</text>
</svg>
