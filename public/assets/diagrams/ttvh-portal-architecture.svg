<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">TTVH Portal &amp; SAP Master Board architecture</title>
  <desc id="d">Employees, admins and SAP viewers use TTVH Portal, a Next.js 15 + NestJS 10 app in a Turborepo. The portal handles Entra ID sign-in with a JWKS check, cookie sessions with refresh rotation, a permissions guard, the app launcher and IT support tickets. SAP Master Board is a module inside the portal that uses the same sign-in and permissions; it holds the sales and returns monitors, the query studio, the SAP gateway and the Excel export. The portal runs on Microsoft Entra ID, PostgreSQL with Prisma 7, MinIO and a SQL Server linked server to SAP HANA for SAP Business One. Highlighted boxes are my work; dashed boxes are platform or team work.</desc>
  <style>
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; fill: #2A231F; }
    .h { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #736860; }
    .tile { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .mine { fill: #F8EBB5; stroke: #D9654B; stroke-width: 2.5; }
    .team { fill: none; stroke: #736860; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .panel { fill: #FFFCF7; stroke: #2A231F; stroke-width: 2; }
    .chip { fill: #D8E6EF; stroke: #2A231F; stroke-width: 1.5; }
    .shadow { fill: #2A231F; }
    .arrow { stroke: #2A231F; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
