<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="480" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    ENTERPRISE WEB PORTAL ARCHITECTURE
  </text>
  <text x="480" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Turborepo Monorepo • Microsoft Entra ID (Azure AD SSO) • 300+ Store Dispatch Platform
  </text>

  <!-- 1. Client & Access Layer -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="260" height="390" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#1e293b"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">
      1. APPS / CLIENT TIER
    </text>

    <!-- Sub-boxes -->
    <g transform="translate(16, 56)">
      <rect width="228" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Next.js 15 App Router</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">React 19 • Tailwind v4 • Base UI</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Role-based Store Dispatch UI</text>
    </g>

    <g transform="translate(16, 155)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Enterprise Auth (MSAL)</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Microsoft Entra ID (Azure AD SSO)</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Assignment-Required Boundary</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cookie-based JWT Session</text>
    </g>

    <g transform="translate(16, 264)">
      <rect width="228" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Contract-First Client</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Orval Codegen from OpenAPI</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Typed React Query v5 Hooks</text>
    </g>
  </g>

  <!-- Connectors 1 to 2 -->
  <path d="M 300 190 L 350 190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="350,190 342,185 342,195" fill="#38bdf8"/>
  <path d="M 300 310 L 350 310" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="350,310 342,305 342,315" fill="#818cf8"/>

  <!-- 2. Core Backend Layer -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect width="260" height="390" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#1e293b"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">
      2. NESTJS 10 GATEWAY &amp; API
    </text>

    <g transform="translate(16, 56)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Security &amp; Session Engine</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Token Rotation &amp; Replay Detect</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Double httpOnly Strict Cookie</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Dynamic RBAC PermissionGuard</text>
    </g>

    <g transform="translate(16, 165)">
      <rect width="228" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Business Dispatch Domain</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Store Requests &amp; App Launcher</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Multi-Brand Brand Router</text>
    </g>

    <g transform="translate(16, 264)">
      <rect width="228" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">SAP Reconcile Hub</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Multi-brand Sales &amp; Return Data</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Intermediate SQL DB Queries</text>
    </g>
  </g>

  <!-- Connectors 2 to 3 -->
  <path d="M 610 190 L 660 190" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="660,190 652,185 652,195" fill="#34d399"/>
  <path d="M 610 320 L 660 320" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="660,320 652,315 652,325" fill="#fbbf24"/>

  <!-- 3. Infrastructure & Enterprise Services -->
  <g transform="translate(660, 100)" filter="url(#shadow)">
    <rect width="260" height="390" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#1e293b"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">
      3. DATA &amp; ENTERPRISE SYSTEMS
    </text>

    <g transform="translate(16, 56)">
      <rect width="228" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">PostgreSQL 16 (Prisma 7)</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Users, Roles, Permissions</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Active Auth Sessions Storage</text>
    </g>

    <g transform="translate(16, 155)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">SAP Business One ERP</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AR Invoices • Good Issues</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Intermediate SQL Staging DB</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Automated Reconciliation</text>
    </g>

    <g transform="translate(16, 264)">
      <rect width="228" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">n8n Automation Engine</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Sync Health Cron Checks</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e" text-anchor="middle">Instant Telegram/Email Alerts</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="505" width="880" height="20" rx="4" fill="#0f172a"/>
  <text x="480" y="519" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    CONFIDENTIAL ARCHITECTURAL BLUEPRINT • SANITIZED FOR ENGINEERING PORTFOLIO SHOWCASE
  </text>
</svg>
