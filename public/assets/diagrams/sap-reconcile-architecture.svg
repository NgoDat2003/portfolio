<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="480" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    RETAIL POS TO ERP DATA RECONCILIATION &amp; AUTOMATION
  </text>
  <text x="480" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">
    iPOS Chuỗi Cửa Hàng → Database Trung Gian → n8n Orchestrator → SAP Business One Sync &amp; Alerts
  </text>

  <!-- Step 1: POS Source Stream -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="260" height="390" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#1e293b"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">
      1. RETAIL POS TRANSACTIONS
    </text>

    <g transform="translate(16, 56)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">300+ Store POS Terminals</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">MayCha • Tam Hảo • Thức Coffee</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Continuous Order Streams</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Bill Detail, Discounts, Vouchers</text>
    </g>

    <g transform="translate(16, 165)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Payment Methods Breakdown</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Cash, VietQR, Momo, POS Card</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Split Billing Reconciliation</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Aggregated Per Shift &amp; Day</text>
    </g>

    <g transform="translate(16, 274)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Edge Buffer</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Local store caching queue</text>
      <text x="114" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">Offline resilient ingestion</text>
    </g>
  </g>

  <!-- Connectors 1 to 2 -->
  <path d="M 300 190 L 350 190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="350,190 342,185 342,195" fill="#38bdf8"/>
  <path d="M 300 310 L 350 310" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="350,310 342,305 342,315" fill="#f43f5e"/>

  <!-- Step 2: Intermediate DB & n8n Monitoring -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect width="260" height="390" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#1e293b"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f43f5e" text-anchor="middle">
      2. STAGING &amp; N8N MONITOR
    </text>

    <g transform="translate(16, 56)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Intermediate SQL Database</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Raw POS tables staging layer</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">AR Invoices, Inventory Movements</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Hourly Batch Check Index</text>
    </g>

    <g transform="translate(16, 165)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">n8n Workflow Engine</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Automated Cron Reconcile</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e" text-anchor="middle">Detects Missing &amp; Failed Bills</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Zero Unchecked Transation Loss</text>
    </g>

    <g transform="translate(16, 274)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Incident Dispatcher</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Immediate Webhook alerts</text>
      <text x="114" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Direct to Finance &amp; IT Ops</text>
    </g>
  </g>

  <!-- Connectors 2 to 3 -->
  <path d="M 610 190 L 660 190" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="660,190 652,185 652,195" fill="#34d399"/>
  <path d="M 610 320 L 660 320" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="660,320 652,315 652,325" fill="#fbbf24"/>

  <!-- Step 3: SAP ERP Target -->
  <g transform="translate(660, 100)" filter="url(#shadow)">
    <rect width="260" height="390" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="12" fill="#1e293b"/>
    <text x="130" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">
      3. SAP BUSINESS ONE ERP
    </text>

    <g transform="translate(16, 56)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">AR Invoices &amp; Revenue</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Standardized journal entry</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Verified General Ledger post</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Account Code Reconciliation</text>
    </g>

    <g transform="translate(16, 165)">
      <rect width="228" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Goods Issue (GI) Inventory</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Ingredient consumption sync</text>
      <text x="114" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">BOM ratio auto-deduction</text>
      <text x="114" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Accurate end-of-day stock</text>
    </g>

    <g transform="translate(16, 274)">
      <rect width="228" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="114" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Executive Financial Reports</text>
      <text x="114" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Audited P&amp;L Statements</text>
      <text x="114" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Multi-brand Store Operations</text>
    </g>
  </g>

  <rect x="40" y="505" width="880" height="20" rx="4" fill="#0f172a"/>
  <text x="480" y="519" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    DATA FLOW BLUEPRINT • IP SANITIZED FOR ENGINEERING PORTFOLIO SHOWCASE
  </text>
</svg>
