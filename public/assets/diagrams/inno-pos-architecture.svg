<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Inno POS architecture</title>
  <desc id="d">Cashier uses the Inno POS React SPA, which talks to a custom ERPNext app over whitelisted REST APIs and socket.io realtime. Highlighted boxes are the modules and APIs built by the portfolio owner.</desc>
  <style>
    text { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; fill: #2A231F; }
    .h { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #736860; }
    .tile { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .mine { fill: #F8EBB5; stroke: #D9654B; stroke-width: 2.5; }
    .team { fill: none; stroke: #736860; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .panel { fill: #FFFCF7; stroke: #2A231F; stroke-width: 2; }
    .shadow { fill: #2A231F; }
    .arrow { stroke: #2A231F; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A231F"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#FAF4EA"/>

  <text x="40" y="58" style="font-size:28px;font-weight:800">Inno POS</text>
  <text x="40" y="82" class="sub" style="font-size:14px">Retail checkout on ERPNext · architecture</text>

  <!-- Legend -->
  <rect x="612" y="40" width="16" height="16" rx="3" class="mine"/>
  <text x="636" y="53" class="small">my work</text>
  <rect x="718" y="40" width="16" height="16" rx="3" class="team"/>
  <text x="742" y="53" class="small">platform / team</text>

  <!-- Users -->
  <rect x="45" y="215" width="150" height="110" rx="14" class="shadow"/>
  <rect x="40" y="210" width="150" height="110" rx="14" fill="#D8E6EF" stroke="#2A231F" stroke-width="2"/>
  <text x="115" y="258" text-anchor="middle" class="h" style="font-size:16px">Cashier</text>
  <text x="115" y="280" text-anchor="middle" class="small">&amp; store manager</text>
  <path d="M192 265 H242" class="arrow"/>

  <!-- POS SPA -->
  <rect x="256" y="116" width="360" height="380" rx="14" class="shadow"/>
  <rect x="250" y="110" width="360" height="380" rx="14" class="panel"/>
  <text x="272" y="142" class="h">Inno POS · React 19 SPA</text>
  <text x="272" y="162" class="sub">Vite build, served as a Frappe app asset</text>

  <rect x="270" y="182" width="160" height="58" rx="10" class="mine"/>
  <text x="350" y="206" text-anchor="middle" class="tile">Cart &amp;</text>
  <text x="350" y="225" text-anchor="middle" class="tile">3-tier promotions</text>
  <rect x="450" y="182" width="150" height="58" rx="10" class="mine"/>
  <text x="525" y="206" text-anchor="middle" class="tile">Split payment</text>
  <text x="525" y="225" text-anchor="middle" class="tile">&amp; VietQR</text>

  <rect x="270" y="252" width="160" height="58" rx="10" class="mine"/>
  <text x="350" y="276" text-anchor="middle" class="tile">Returns &amp;</text>
  <text x="350" y="295" text-anchor="middle" class="tile">refund allocation</text>
  <rect x="450" y="252" width="150" height="58" rx="10" class="mine"/>
  <text x="525" y="276" text-anchor="middle" class="tile">Repair orders</text>
  <text x="525" y="295" text-anchor="middle" class="tile">&amp; fast delivery</text>

  <rect x="270" y="322" width="160" height="58" rx="10" class="mine"/>
  <text x="350" y="346" text-anchor="middle" class="tile">Branch stock</text>
  <text x="350" y="365" text-anchor="middle" class="tile">lookup</text>
  <rect x="450" y="322" width="150" height="58" rx="10" class="mine"/>
  <text x="525" y="346" text-anchor="middle" class="tile">Face-match</text>
  <text x="525" y="365" text-anchor="middle" class="tile">customer pick (via API)</text>

  <rect x="270" y="400" width="330" height="70" rx="10" class="team"/>
  <text x="435" y="429" text-anchor="middle" class="tile">Zustand · TanStack Query · socket.io</text>
  <text x="435" y="450" text-anchor="middle" class="sub">cart state · server cache · realtime</text>

  <!-- Links -->
  <text x="643" y="228" text-anchor="middle" class="sub" style="font-size:11px">REST</text>
  <path d="M618 240 H666" class="arrow" style="marker-start:url(#head)"/>
  <text x="643" y="348" text-anchor="middle" class="sub" style="font-size:11px">socket</text>
  <path d="M618 360 H666" class="arrow" style="marker-start:url(#head)"/>

  <!-- ERPNext -->
  <rect x="676" y="116" width="250" height="380" rx="14" class="shadow"/>
  <rect x="670" y="110" width="250" height="380" rx="14" class="panel"/>
  <text x="690" y="142" class="h">ERPNext · Frappe</text>
  <text x="690" y="162" class="sub">custom app in Python</text>

  <rect x="686" y="182" width="216" height="44" rx="10" class="mine"/>
  <text x="794" y="209" text-anchor="middle" class="tile">POS invoice search API</text>
  <rect x="686" y="236" width="216" height="44" rx="10" class="mine"/>
  <text x="794" y="263" text-anchor="middle" class="tile">Payment totals API</text>
  <rect x="686" y="290" width="216" height="44" rx="10" class="mine"/>
  <text x="794" y="317" text-anchor="middle" class="tile">Branch stock &amp; sales API</text>
  <rect x="686" y="344" width="216" height="44" rx="10" class="mine"/>
  <text x="794" y="371" text-anchor="middle" class="tile">Print formats: invoice · repair</text>

  <rect x="686" y="402" width="216" height="34" rx="10" class="team"/>
  <text x="794" y="424" text-anchor="middle" class="small">Whitelisted APIs · realtime</text>
  <rect x="686" y="444" width="216" height="34" rx="10" class="team"/>
  <text x="794" y="466" text-anchor="middle" class="small">MariaDB</text>
</svg>
